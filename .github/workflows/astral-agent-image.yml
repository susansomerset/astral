name: Astral Agent image

on:
  push:
    branches: [dev, main]
    paths:
      - 'service/astral_agent/**'
      - '.github/workflows/astral-agent-image.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'service/astral_agent/**'
      - '.github/workflows/astral-agent-image.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel tag to publish'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # main -> production, dev -> staging, PRs -> pr-<number>; manual dispatch uses the chosen channel.
      - name: Resolve channel tag
        id: chan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ch="${{ github.event.inputs.channel }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ch="pr-${{ github.event.number }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ch="production"
          else
            ch="staging"
          fi
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
      # docker-container driver enables the GHA cache backend used below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build context = repo root; the Dockerfile COPYs service/astral_agent/ (root-relative).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/astral_agent/Dockerfile
          push: true
          tags: |
            ghcr.io/susansomerset/astral-agent:${{ steps.chan.outputs.channel }}
            ghcr.io/susansomerset/astral-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Railway pulls image-sourced services on explicit trigger only — it does
      # NOT watch the registry tag. Same project tokens/environments as Telescope.
      # Service IDs are picked in shell, not via `cond && 'a' || 'b'`: an empty
      # production ID would be falsy and silently fall through to staging's.
      # Staging = agent-staging. Blank SERVICE_ID = Railway service not created yet;
      # push only, no redeploy.
      - name: Trigger Railway redeploy
        if: github.event_name != 'pull_request'
        env:
          CHANNEL: ${{ steps.chan.outputs.channel }}
          RAILWAY_TOKEN: ${{ steps.chan.outputs.channel == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          if [ "$CHANNEL" = "production" ]; then
            ENV_ID='2ce313de-780c-490c-ae5d-ecb7903fc215'
            SERVICE_ID=''
          else
            ENV_ID='2604ddad-4700-4341-b2a5-7af42d70e9f1'
            SERVICE_ID='fd497923-db15-4167-8672-7c40f313b313'
          fi
          if [ -z "$SERVICE_ID" ]; then
            echo "::notice::No astral-agent Railway service ID for $CHANNEL yet; image pushed, redeploy skipped."
            exit 0
          fi
          resp=$(curl -sf --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: ${RAILWAY_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"query\":\"mutation(\$e:String!,\$s:String!){ serviceInstanceDeployV2(environmentId:\$e, serviceId:\$s) }\",\"variables\":{\"e\":\"${ENV_ID}\",\"s\":\"${SERVICE_ID}\"}}")
          echo "$resp"
          echo "$resp" | grep -q '"errors"' && exit 1 || true
