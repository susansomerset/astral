name: Telescope image

on:
  push:
    branches:
      - 'ftr/**'
    paths:
      - 'service/telescope/**'
      - '.github/workflows/telescope-image.yml'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build context = repo root; the Dockerfile COPYs service/telescope/ (root-relative).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/telescope/Dockerfile
          push: true
          tags: |
            ghcr.io/susansomerset/telescope:staging
            ghcr.io/susansomerset/telescope:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
