# Astral Telescope — Railway config-as-code (AST-1727 / Phase 1).
# Point this Railway *service* Config-as-Code path at:
#   /service/telescope/railway.toml
# Do NOT set Railway Root Directory to /service/telescope — the Dockerfile
# COPY paths are monorepo-root relative (`COPY service/telescope/ …`).
# Build context = repository root; dockerfilePath below selects the image.
#
# Telescope is a queue consumer: it pulls scrape jobs from the telescope_job table in
# Postgres and writes results back. Nothing calls into it over HTTP.
#
# Dashboard-only (not expressible / not safe in this file):
#   - Set ASTRAL_DATABASE_URL on Telescope *and* the platform to the astral
#     Postgres database's private URL (Railway reference to that service's DATABASE_URL).
#     Telescope creates its telescope_* tables there on startup (idempotent).
#   - No public domain needed. /healthz is unauthenticated and only reports status.
#   - Serverless ON: after IDLE_SLEEP_SECONDS (telescope_config.py) with no work, Telescope
#     closes Postgres + Firefox so Railway sleeps it. The platform pings
#     $TELESCOPE_BASE_URL/wake (e.g. http://<telescope-service>.railway.internal:8080)
#     — throttled — when it enqueues work and no worker is live.
#   - Scale out by raising replicas; each replica claims up to WORKER_CONCURRENCY
#     jobs (telescope_config.py). Queue depth is the signal for adding replicas.
#   - /dev/shm: if Firefox flakes on shared memory, raise container disk or
#     follow Railway shm guidance; Dockerfile documents --shm-size for local Docker.

[build]
builder = "DOCKERFILE"
dockerfilePath = "service/telescope/Dockerfile"
watchPatterns = ["service/telescope/**"]

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 120
# Old replica keeps running this long after SIGTERM so in-flight scrapes finish;
# anything still running is handed back to the queue (SHUTDOWN_GRACE_SECONDS = 25).
drainingSeconds = 30
# ~2 GiB per replica — WORKER_CONCURRENCY must fit inside it.
limitOverride = { containers = { memoryBytes = 2147483648 } }
